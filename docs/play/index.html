<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gatehouse</title>
<meta name="description" content="A tiny text adventure: talk your way past a tired gate guard. A Honeytongue demo.">
<!-- Set content to your proxy's URL (see examples/cloudflare-worker.js) to play with Jev. Empty = offline mock. -->
<meta name="honeytongue-proxy" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=VT323&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%272%27 fill=%27%230c0904%27/%3E%3Crect x=%275%27 y=%273%27 width=%276%27 height=%2710%27 fill=%27%23f2b34d%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="../style.css">
<script src="../theme.js"></script>
<style>
.game { max-width: 76ch; margin: 0 auto; padding: 1.5rem 1rem 2rem; }
@media (min-width: 700px) { .game { padding: 2.5rem 1.5rem 3rem; } }
.banner { margin: 0 0 1.5rem; }
.banner h1 { font-size: clamp(2.6rem, 11vw, 4rem); line-height: 0.85; margin: 0 0 0.5rem; }
.banner p { color: var(--dim); margin: 0; }
.mode { border: 1px dashed var(--dim); color: var(--dim); padding: 0.5rem 0.8rem; margin: 0 0 1.5rem; font-size: 0.9rem; }
.mode strong { color: var(--bright); }

#log p { margin: 0 0 0.9rem; white-space: pre-wrap; }
#log .cmd { margin-top: 1.4rem; }
#log .debug { color: var(--dim); font-size: 0.85rem; margin: 0 0 0.6rem; }
#log .debug .readout { margin: 0.15rem 0; }
#log .room-name { color: var(--bright); font-weight: 600; margin-bottom: 0.2rem; }
#log .ending { color: var(--bright); text-align: center; letter-spacing: 0.08em; margin: 1.5rem 0; text-shadow: var(--glow-strong); }
#log .ending::before, #log .ending::after { content: " *** "; white-space: pre; color: var(--dim); }
#log .error { color: var(--bright); border-left: 3px solid var(--dim); padding-left: 0.75rem; }
#log .thinking::after { content: "..."; }
@media (prefers-reduced-motion: no-preference) {
  #log .thinking::after { animation: dots 1.2s steps(4) infinite; display: inline-block; overflow: hidden; vertical-align: bottom; width: 3ch; }
  @keyframes dots { from { width: 0; } to { width: 4ch; } }
}

.choices { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1rem; }
.choices:empty { display: none; }
.key {
  font: 500 0.85rem var(--mono); color: var(--fg); text-shadow: inherit;
  background: none; border: 1px solid var(--dim); padding: 0.35rem 0.7rem; cursor: pointer; text-align: left;
}
.key:hover { background: var(--fg); color: var(--bg); text-shadow: none; }
.key b { color: var(--bright); font-weight: 600; }
.key:hover b { color: inherit; }

#prompt { display: flex; align-items: baseline; gap: 0.6ch; border-bottom: 1px dashed var(--line); padding: 0.4rem 0; margin-top: 0.5rem; }
#prompt span { color: var(--dim); font-weight: 500; }
#cmd {
  flex: 1; min-width: 0;
  font: 500 1rem/1.5 var(--mono); /* 16px or more stops phones zooming in */
  color: var(--bright); caret-color: var(--bright); text-shadow: inherit;
  background: transparent; border: 0; padding: 0; outline: none;
}
#prompt:focus-within { border-bottom-color: var(--dim); }
#cmd::placeholder { color: var(--dim); opacity: 0.8; }
#cmd[readonly] { opacity: 0.6; }
.shortcuts { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 0; }
.status .pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 0.35rem; }
.status .pips i { width: 0.55rem; height: 0.8rem; border: 1px solid currentColor; }
.status .pips i.on { background: currentColor; }
.status .moves { white-space: nowrap; }
a.key { text-decoration: none; }
@media (max-width: 420px) { .status .label { display: none; } }
@media (max-width: 340px) { .status .moves-label { display: none; } }
</style>
</head>
<body>
<header class="status">
  <span class="room" id="room">The Gatehouse</span>
  <span class="extra" id="patience" hidden></span>
  <span class="moves"><span class="moves-label">Moves </span><span id="moves">0</span></span>
  <button type="button" data-theme-toggle>Paper</button>
</header>

<main class="game">
  <div class="banner">
    <h1>The Gatehouse</h1>
    <p>An interactive persuasion demo<br>Release 1 / Serial number 260925 / <a href="../">Honeytongue 0.1</a></p>
  </div>
  <p class="mode" id="mode" hidden></p>

  <div id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
  <div class="choices" id="choices"></div>

  <form id="prompt" autocomplete="off">
    <label class="vh" for="cmd">What do you do?</label>
    <span aria-hidden="true">&gt;</span>
    <input id="cmd" name="cmd" maxlength="500" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="What do you do?">
  </form>
  <div class="shortcuts" aria-label="Shortcuts">
    <button type="button" class="key" data-say="look">Look</button>
    <button type="button" class="key" data-say="inventory">Inventory</button>
    <button type="button" class="key" data-say="help">Help</button>
    <button type="button" class="key" data-say="debug" id="debug-key" aria-pressed="false">Debug</button>
    <button type="button" class="key" data-say="restart">Restart</button>
  </div>
</main>

<footer class="wrap">
  <p>Made with <a href="../">Honeytongue</a>: Jev judges what you say, and the story decides what happens. Tip: press the up arrow to bring back your last command.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
