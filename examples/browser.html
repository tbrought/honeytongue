<!doctype html>
<!-- A minimal browser game using Honeytongue through your proxy.
     To try it locally with no API key, from the repository folder:
       npm run proxy                 (the proxy, using the offline mock)
       npx serve -l 8000 .           (in a second terminal; any static server on port 8000 works)
     then open http://localhost:8000/examples/browser.html
     In your own game, import from https://cdn.jsdelivr.net/npm/honeytongue@0.2/src/index.js
     and set PROXY_URL to your deployed proxy. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk your way past the guard</title>
</head>
<body>
  <p>Sergeant Maren blocks the gate. What do you say?</p>
  <form id="talk">
    <label for="line">Your words</label>
    <input id="line" maxlength="500" autocomplete="off" size="60" required>
    <button>Say it</button>
  </form>
  <p id="reply" aria-live="polite"></p>

  <script type="module">
    import { Persuadable, createProxyClient } from "../src/index.js";

    const PROXY_URL = "http://localhost:8787";

    const maren = new Persuadable(
      {
        name: "Sergeant Maren",
        persona: "A tired night guard who values honesty and despises flattery and bribes.",
        goal: "Open the gate after curfew",
        patience: 4,
        reactions: [
          { min: 0, text: "\"Gate's shut till dawn.\"" },
          { min: 2, text: "She hesitates. \"You'll have to do better than that.\"" },
        ],
      },
      { client: createProxyClient({ url: PROXY_URL }) },
    );

    const form = document.getElementById("talk");
    const input = document.getElementById("line");
    const button = form.querySelector("button");
    const reply = document.getElementById("reply");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!input.value.trim()) return;
      button.disabled = true;
      try {
        const r = await maren.attempt(input.value);
        if (r.verdict === "convinced") reply.textContent = "Maren sighs and lifts the bar. You're through.";
        else if (r.outOfPatience) reply.textContent = "\"Enough.\" Maren blows her whistle.";
        else reply.textContent = r.verdict === "offended" ? "Her hand drops to her club." : r.reaction;
        input.value = "";
      } catch (err) {
        reply.textContent = `Couldn't reach the proxy: ${err.message}`;
      } finally {
        button.disabled = maren.convinced || maren.outOfPatience;
      }
    });
  </script>
</body>
</html>
