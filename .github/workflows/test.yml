name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is the oldest version package.json promises; 22 and 24 are the current LTS lines.
        # Windows too, since that's where Honeytongue is developed.
        node: [18, 20, 22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Zero runtime dependencies and no lockfile, so there is nothing to install.
      - run: npm test
      # The scripts aren't covered by unit tests; make sure they still run end to end.
      - run: npm run example
      - run: npm run eval -- --mock
