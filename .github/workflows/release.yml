name: release

# Stages a release on npm when a version tag (like v0.1.0-alpha.7) is pushed, after every check passes and the
# maintainer approves the run in the protected "npm" environment. It uses npm's trusted publishing: npm trusts this
# workflow through a short-lived OIDC token, so no npm token is stored anywhere, and npm adds a provenance statement.
# The trusted publisher may only stage ("publish directly" is off on npmjs.com), so nothing goes public until the
# maintainer approves the staged version on npmjs.com with two-factor authentication. The setup is under
# "Releasing" in CLAUDE.md.
on:
  push:
    tags: ["v*"]

# Nothing here can write to the repository. Only the publish job may ask for an OIDC token.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json, and is on main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version ($version). Tag the release commit as v$version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit isn't on main. Merge the release pull request first, then tag main."
            exit 1
          fi
      - name: Prereleases go to the alpha tag, stable versions to latest
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "dist-tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:oldest
      - name: The demo's copies in docs/ are up to date
        run: |
          npm run build:demo
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/play/lib is out of date. Run npm run build:demo and commit the result."
            exit 1
          fi
      - name: Pack, install, and smoke-test the package
        run: npm run check:package

  publish:
    name: Stage on npm
    needs: verify
    runs-on: ubuntu-latest
    # Waits here for the maintainer's approval. Only this job can mint the OIDC token npm trusts.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later (trusted publishing, 11.5.1).
      - run: npm install -g npm@11.20.0
      # No npm ci here: the package has no dependencies to build, so nothing else runs while the token exists.
      # The tag is fixed when the version is staged, and applied when it's approved.
      - name: Stage for approval on npmjs.com
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: npm stage publish --tag "$DIST_TAG"
